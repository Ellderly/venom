name: build
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save electron@33.2.0 electron-builder@25.1.8
      - run: npx electron-builder --win portable --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: VENOM-windows
          path: release/*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: VENOM 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: Скачайте VENOM.exe и запустите. Установка не нужна.
          files: release/VENOM.exe
          make_latest: true
